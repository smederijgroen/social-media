name: Render social
on:
  push:
    paths: ['jobs/**.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: render
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 ffmpeg-static@5.2.0 && npx playwright install --with-deps chromium
      - run: node tools/render.js
      - run: node tools/reel.js
      - run: if ls jobs/probe-* >/dev/null 2>&1; then node tools/probe.js; rm -f jobs/probe-*; fi
      - name: Bewaar resultaat
        run: |
          git config user.name "social-render"
          git config user.email "info@smederijpapendrecht.nl"
          git add -A output jobs
          git diff --cached --quiet || (git commit -m "Render resultaten" && git pull --rebase && git push)
